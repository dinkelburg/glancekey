name: FaceUnlock
options:
  bundleIdPrefix: nl.dinkelworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: U78YQGE72M
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FaceUnlockCore:
    path: Core
targets:
  FaceUnlockMac:
    type: application
    platform: macOS
    sources:
      - Mac
    dependencies:
      - package: FaceUnlockCore
        product: FaceUnlockCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: FaceUnlock
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_NAME: FaceUnlock
        PRODUCT_BUNDLE_IDENTIFIER: nl.dinkelworks.faceunlock.mac
        CODE_SIGN_IDENTITY: Apple Development
        # Not sandboxed: it posts keyboard events to the lock screen.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  FaceUnlockiOS:
    type: application
    platform: iOS
    sources:
      - iOS
    dependencies:
      - package: FaceUnlockCore
        product: FaceUnlockCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: FaceUnlock
        NSFaceIDUsageDescription: FaceUnlock uses Face ID to approve unlocking your computers.
        # The relay is HTTPS; plain HTTP is only allowed to local addresses, for a relay running with `wrangler dev`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: nl.dinkelworks.faceunlock
            CFBundleURLSchemes: [faceunlock]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: FaceUnlock
        PRODUCT_BUNDLE_IDENTIFIER: nl.dinkelworks.faceunlock
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
