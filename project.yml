name: GlanceKey
options:
  bundleIdPrefix: nl.dinkelworks
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # The app's name (Core/Sources/AppCore/Brand.swift explains renaming). APP_ID also makes the bundle IDs and
    # the URL scheme; the scripts read both from here (scripts/brand.sh).
    APP_NAME: GlanceKey
    APP_ID: glancekey
    DEVELOPMENT_TEAM: U78YQGE72M
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
# In the project for Xcode's StoreKit testing, not in the app.
fileGroups:
  - iOS/Unlimited.storekit
packages:
  AppCore:
    path: Core
targets:
  MacApp:
    type: application
    platform: macOS
    sources:
      - path: Mac
        # The sudo PAM module is built by scripts/enable-mac-sudo.sh, not into the app.
        excludes:
          - PAM
    dependencies:
      - package: AppCore
        product: AppCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        # From the build settings, so the release scripts can set the build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: nl.dinkelworks.$(APP_ID).mac
        CODE_SIGN_IDENTITY: Apple Development
        # Not sandboxed: it posts keyboard events to the lock screen.
        ENABLE_APP_SANDBOX: NO
        # Keeps other programs from loading code into the app (which holds the password); notarization needs it too.
        ENABLE_HARDENED_RUNTIME: YES
        # The helpers script reads the Go and C sources and writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Without this, Apple Development builds (scripts/build-mac.sh) carry get-task-allow, which lets debuggers
        # read the app's memory, password included. Debug builds keep it for Xcode's debugger.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postCompileScripts:
      # The sudo checker, PAM module and pam-check, so the menu can turn sudo approvals on (AppModel).
      - name: Build sudo helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/go/bin:/usr/local/bin"
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          "$SRCROOT/scripts/build-mac-helpers.sh" "$helpers"
          if [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            timestamp=--timestamp=none
            [ "$ACTION" = install ] && timestamp=--timestamp  # archives get notarized, which needs a timestamp
            for helper in "$helpers"/*; do
              codesign --force --options runtime $timestamp --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$helper"
            done
          fi
  PhoneApp:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "*.storekit"
    # The subscription's products for running from Xcode, without App Store Connect (Store.swift).
    scheme:
      storeKitConfiguration: iOS/Unlimited.storekit
    dependencies:
      - package: AppCore
        product: AppCore
      # Draws the lock screen card.
      - target: PhoneWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: $(APP_NAME) uses Face ID to approve unlocking your computers.
        # Only encryption built into iOS (HTTPS, and CryptoKit for the signing keys and the sealed password's key),
        # which is exempt from export documentation, so App Store Connect doesn't ask about it for every upload.
        ITSAppUsesNonExemptEncryption: false
        # The relay is HTTPS; plain HTTP is only allowed to local addresses, for a relay running with `wrangler dev`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(APP_ID)]
        UILaunchScreen: {}
        # The lock screen card (iOS/Shared/LiveCard.swift). Frequent updates: it follows the computers locking and
        # unlocking, which the relay pushes as they happen.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/PhoneApp.entitlements
      properties:
        # Notifications through Apple's push service, which the relay sends. Signing turns this into
        # "production" for TestFlight and the App Store; the relay tries both.
        aps-environment: development
        # A waiting sudo is worth a notification during a Focus.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: nl.dinkelworks.$(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: no Mac or Vision Pro run destinations in Xcode. Whether the App Store offers the app there is a
        # separate setting in App Store Connect (Pricing and Availability), which should be off too.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  # Draws the lock screen card (a Live Activity) on the Lock Screen and in the Dynamic Island.
  PhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - iOSWidgets
      - iOS/Shared
    dependencies:
      - package: AppCore
        product: AppCore
    info:
      path: iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: nl.dinkelworks.$(APP_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
